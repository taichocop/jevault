name: Validate and release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Require protected release tags (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          node scripts/require-protected-release-tags.mjs
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      # build は typecheck と production main.js の license notice 検証も実行する。
      - run: npm run build
      - run: node scripts/prepare-release.mjs
      - run: sha256sum --check release-assets.sha256
      - run: cat release-assets.sha256
      - name: Validate publication with GitHub CLI 2.102.0 (mock only)
        run: |
          cli_root="$RUNNER_TEMP/jevault-cli-2.102.0"
          mkdir "$cli_root"
          curl --fail --location --silent --show-error \
            https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz \
            --output "$cli_root/gh.tar.gz"
          echo 'bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386  gh.tar.gz' | (cd "$cli_root" && sha256sum --check)
          tar -xzf "$cli_root/gh.tar.gz" -C "$cli_root"
          node scripts/validate-release-cli.mjs "$cli_root/gh_2.102.0_linux_amd64/bin/gh"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Check trusted release ref
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" != '0.1.0'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD origin/main
      - name: Require protected release tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          node scripts/require-protected-release-tags.mjs
      - name: Stage and validate exact assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/prepare-release.mjs "$RELEASE_TAG"
          sha256sum --check release-assets.sha256
          cat release-assets.sha256
      # この3ファイルだけを attest し、後続も同じ stage path を使用する。
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release-assets/main.js
            release-assets/manifest.json
            release-assets/styles.css
      - name: Publish the attested bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check release-assets.sha256
          node scripts/publish-release.mjs "$RELEASE_TAG"
